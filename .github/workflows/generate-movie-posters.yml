name: Generate original movie-shelf artwork

on:
  push:
    paths:
      - 'content/movies.json'
      - '.github/workflows/generate-movie-posters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Generate posters for movies without artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = 'content/movies.json';
          if (!process.env.OPENAI_API_KEY) {
            console.log('OPENAI_API_KEY is not configured. No poster was generated. Add it in repository Settings → Secrets and variables → Actions.');
            process.exit(0);
          }
          const movies = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slugify = s => s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 70) || 'movie';
          const pending = movies.filter(m => m && m.title && !m.poster).slice(0, 3);
          if (!pending.length) { console.log('No movies need poster artwork.'); process.exit(0); }
          fs.mkdirSync('assets/uploads/posters', { recursive: true });
          for (const movie of pending) {
            const slug = slugify(movie.title);
            const prompt = `Create premium original cinematic poster ARTWORK for a personal movie recommendation website called 13XTAR. Movie title for context: ${movie.title}. Release year: ${movie.year || 'not specified'}. Genre: ${movie.genre || 'cinematic drama'}. Mood and visual direction: ${movie.description || 'evocative, atmospheric, dramatic lighting, strong composition, rich filmic texture'}. Make a vertical 2:3 theatrical-style composition with a clear focal subject, cinematic lighting, beautiful detail and strong contrast. ORIGINAL fan-made editorial artwork only: do not copy any existing film poster, actor likeness, studio logo, franchise character, or trademarked poster layout. Do not render any text, letters, logos, watermarks, or title; the website adds the movie title separately.`;
            console.log(`Generating original artwork for: ${movie.title}`);
            const response = await fetch('https://api.openai.com/v1/images/generations', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ model: 'gpt-image-1', prompt, size: '1024x1536', quality: 'high', n: 1 })
            });
            const body = await response.json();
            if (!response.ok) throw new Error(`Image API failed (${response.status}): ${JSON.stringify(body).slice(0, 1200)}`);
            const b64 = body.data && body.data[0] && body.data[0].b64_json;
            if (!b64) throw new Error(`No image data returned for ${movie.title}`);
            const out = path.join('assets/uploads/posters', `${slug}.png`);
            fs.writeFileSync(out, Buffer.from(b64, 'base64'));
            movie.poster = out;
            console.log(`Saved ${out}`);
          }
          fs.writeFileSync(file, JSON.stringify(movies, null, 2) + '\n');
          NODE

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/movies.json assets/uploads/posters
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Generate original movie poster artwork"
            git push
          fi
